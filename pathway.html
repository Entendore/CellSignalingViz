        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             
             #config {
                 float: left;

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        
            <div id="config"></div>
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "EGFR", "label": "EGFR", "shape": "dot", "size": 10, "title": "Epidermal Growth Factor Receptor"}, {"color": "#97c2fc", "id": "GRB2", "label": "GRB2", "shape": "dot", "size": 10, "title": "Growth factor receptor-bound protein 2"}, {"color": "#97c2fc", "id": "SOS", "label": "SOS", "shape": "dot", "size": 10, "title": "Son of Sevenless"}, {"color": "#97c2fc", "id": "RAS", "label": "RAS", "shape": "dot", "size": 10, "title": "RAS protein"}, {"color": "#97c2fc", "id": "RAF", "label": "RAF", "shape": "dot", "size": 10, "title": "RAF kinase"}, {"color": "#97c2fc", "id": "MEK", "label": "MEK", "shape": "dot", "size": 10, "title": "MEK kinase"}, {"color": "#97c2fc", "id": "ERK", "label": "ERK", "shape": "dot", "size": 10, "title": "ERK kinase"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "EGFR", "title": "binds to", "to": "GRB2", "width": 1}, {"arrows": "to", "from": "GRB2", "title": "activates", "to": "SOS", "width": 1}, {"arrows": "to", "from": "SOS", "title": "activates", "to": "RAS", "width": 1}, {"arrows": "to", "from": "RAS", "title": "activates", "to": "RAF", "width": 1}, {"arrows": "to", "from": "RAF", "title": "phosphorylates", "to": "MEK", "width": 1}, {"arrows": "to", "from": "MEK", "title": "phosphorylates", "to": "ERK", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"nodes": {"font": {"size": 16, "face": "Arial"}, "color": {"border": "#2B7CE9", "background": "#97C2FC"}}, "edges": {"color": "gray", "arrows": {"to": {"enabled": true}}, "font": {"align": "top"}}, "physics": {"enabled": true, "barnesHut": {"gravitationalConstant": -30000, "springLength": 250}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
